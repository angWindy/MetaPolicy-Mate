[pytest]
asyncio_mode = auto
markers =
    requires_rag_runtime: tests that require live Postgres + Qdrant + Redis
        (and R2 when storage is exercised). Per plan rule §1: every test runs
        against real services in conda `p234` — no mocks. Run locally with
        `pytest tests/`; CI must export the same env vars as `.env` / `.env.rag`.
    uses_real_db: tests that need a real (or in-memory) SQLAlchemy session.
        Equivalent to requires_rag_runtime for the DB-only path.
    eval_slow: end-to-end smoke evaluation of the retrieval workflow. These
        tests exercise the full RAG pipeline with stub retriever/reranker and
        assert latency / citation / confidence contracts. Skip locally with
        ``-m 'not eval_slow'``; CI must run them so regressions surface.
filterwarnings =
    # src/db/repository.py is deprecated as of 2026-08-31 (B-P3-01).
    # The DeprecationWarning should be visible in CI logs so any
    # remaining consumer gets noticed. Tests that intentionally
    # exercise the legacy gate use ``pytest.warns(DeprecationWarning)``.
    default::DeprecationWarning:src.db.repository
    ignore::DeprecationWarning:src.retrieval.hybrid
    ignore::DeprecationWarning:src.rag.container
testpaths = tests
addopts = -ra --basetemp=.pytest_temp